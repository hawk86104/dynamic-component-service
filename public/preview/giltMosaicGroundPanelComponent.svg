<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120b08"/>
      <stop offset="50%" stop-color="#2d180e"/>
      <stop offset="100%" stop-color="#0f0a07"/>
    </linearGradient>
    <linearGradient id="tileA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffefc7"/>
      <stop offset="40%" stop-color="#cf8f33"/>
      <stop offset="100%" stop-color="#523114"/>
    </linearGradient>
    <linearGradient id="tileB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe1aa"/>
      <stop offset="45%" stop-color="#b86e27"/>
      <stop offset="100%" stop-color="#3d2611"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fff3ca" stop-opacity="0.7"/>
      <stop offset="55%" stop-color="#ffd680" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffd680" stop-opacity="0"/>
    </radialGradient>
    <pattern id="mosaic" width="96" height="96" patternUnits="userSpaceOnUse">
      <rect width="96" height="96" fill="#140d08"/>
      <g transform="translate(8 8)">
        <rect x="0" y="0" width="34" height="34" rx="4" fill="url(#tileA)"/>
        <rect x="42" y="0" width="38" height="28" rx="4" fill="url(#tileB)"/>
        <rect x="0" y="42" width="28" height="38" rx="4" fill="url(#tileB)"/>
        <rect x="36" y="34" width="44" height="46" rx="5" fill="url(#tileA)"/>
      </g>
    </pattern>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect x="56" y="56" width="400" height="400" rx="28" fill="url(#mosaic)" transform="rotate(-8 256 256)"/>
  <rect x="56" y="56" width="400" height="400" rx="28" fill="url(#glow)" transform="rotate(-8 256 256)"/>
  <ellipse cx="316" cy="172" rx="118" ry="64" fill="#fff1c9" opacity="0.18"/>
  <ellipse cx="194" cy="310" rx="140" ry="78" fill="#ffcf76" opacity="0.12"/>
</svg>
